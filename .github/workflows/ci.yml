name: CI

on:
  pull_request:
    paths-ignore:
      - README.md
  push:
    branches: [main]
    paths-ignore:
      - README.md

permissions:
  contents: read

env:
  SITE_BASE: /

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Format debug
        run: |
          npx prettier --write src/pages/about.astro tests/e2e/site.spec.ts
          git diff -- src/pages/about.astro tests/e2e/site.spec.ts
      - run: npm run format:check
      - run: npm run lint
      - run: npm run check
      - run: npm run test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
