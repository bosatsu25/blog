name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  SITE_URL: https://example.test
  SITE_BASE: /

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check formatting
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm run test
      - name: Build and type-check
        run: npm run build
      - name: Verify root and subpath hosting artifacts
        run: npm run test:hosting
      - name: Static security audit
        run: npm run security:audit
      - name: Performance budget
        run: npm run performance:budget
      - name: Dependency audit
        run: npm run audit

  browser:
    name: Browser gate
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - name: E2E
        run: npm run test:e2e
      - name: Security browser tests
        run: npm run test:security
      - name: Accessibility
        run: npm run test:accessibility

  ci-gate:
    name: CI gate
    if: always()
    needs: [quality, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify required gates
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: |
          echo "quality=$QUALITY_RESULT"
          echo "browser=$BROWSER_RESULT"
          test "$QUALITY_RESULT" = "success"
          test "$BROWSER_RESULT" = "success"
